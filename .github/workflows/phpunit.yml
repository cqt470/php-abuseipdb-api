name: PHPUnit Tests

on:
  push:
    branches: [ "master", "test/**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloads the code
    - uses: actions/checkout@v4

    # 2. Installs PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    # 3. Executes every test suite using the local PHAR file
    - name: Run unit tests
      run: php tools/phpunit-10.phar --testsuite unit

    - name: Run smoke tests
      run: php tools/phpunit-10.phar --testsuite smoke

    # starts PHP built-in servers on ports 17490 and 17495-17499
    - name: Run findings tests
      run: php tools/phpunit-10.phar --testsuite findings