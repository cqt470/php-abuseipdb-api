<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST PAGE - PHP AbuseIPDB API</title>
</head>
<body>
    <h1>TEST PAGE - PHP AbuseIPDB API</h1>
    <p>Test your API to see if it works. Created by <a href="https://github.com/cqt470" target="_blank">zerokelvin</a>, have fun :)</p>
    <div style="display:flex;flex-direction:column;width:160px;gap:16px">
        <label for="ip">IP Address</label>
        <input type="text" name="ip">
        <button type="submit">Test</button>
        <p id="response"></p>
    </div>
    <script>
        const response = document.querySelector("#response");
        const ip = document.querySelector("[name=ip]");

        async function get_data(url, payload){
            try{
                const response = await fetch(url, payload);
                if(!response.ok){
                    return {"error": response.status};
                }

                const result = await response.json();
                return {"message": result?.message, "content": result};
            }catch(error){
                return {"error": error.message, "type": "trycatch"};
            }
        }

        document.querySelector("[type=submit]").addEventListener("click", async (e) => {
            e.preventDefault();
            const val_ip = ip.value;

            if(val_ip == "" || !val_ip){
                response.innerHTML = "Specify an IP address.";
                return;
            }else{
                response.innerHTML = "";
            }

            const payload = {
                "method": "POST",
                "body": JSON.stringify({
                    "ip": val_ip,
                })
            };

            const result = await get_data("http://localhost:8000/api/check.php", payload);

            console.log(result.error)
        })
    </script>
</body>
</html>
