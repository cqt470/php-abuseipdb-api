<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST PAGE - PHP AbuseIPDB API</title>
</head>
<body>
    <h1>TEST PAGE - PHP AbuseIPDB API</h1>
    <h3>CURRENT API: /check.php</h3>
    <p>Test your API to see if it works. Created by <a href="https://github.com/cqt470" target="_blank">zerokelvin</a>, have fun :)</p>
    <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;flex-direction:column;gap:16px;width:180px;">
            <label for="ip">IP Address</label>
            <input type="text" name="ip">
            <button type="button" id="check-button">Test</button>
            <p style="font-weight:bold;color:red;">Beaware: by clicking Test, you may use actual AbuseIPDB tokens. If you're reporting an IP to test if it works, delete the report in your account afterwards!!</p>
        </div>
        <p id="response"></p>
    </div>
    <script>
        const response = document.querySelector("#response");
        const ip = document.querySelector("[name=ip]");

        async function get_data(url, payload){
            try{
                const response = await fetch(url, payload);
                const result = await response.json();

                if(!response.ok){
                    return {"message": result?.message, "code": response.status};
                }

                return {"message": result?.message, "parameters": result?.parameters, "code": response.status};
            }catch(error){
                return {"error": error.message, "type": "trycatch"};
            }
        }

        document.querySelector("#check-button").addEventListener("click", async (e) => {
            e.preventDefault();
            const val_ip = ip.value;

            if(val_ip == "" || !val_ip){
                response.innerHTML = "Specify an IP address.";
                return;
            }else{
                response.innerHTML = "";
            }

            const payload = {
                "method": "POST",
                "body": JSON.stringify({
                    "action": "hello",
                    "ip": val_ip,
                    "token": "your-key"
                })
            };

            const result = await get_data("http://localhost:8000/api/abuseipdb.php", payload);
            response.innerHTML = `API Response: ${result.message} (HTTP: ${result.code})`;
            if(result?.parameters?.info)response.innerHTML += `<br><pre>${JSON.stringify(result?.parameters?.info, null, 2)}</pre>`;
        })
    </script>
</body>
</html>
